{% extends "base.html" %}
{% block title %}注册新用户 - 校园二手交易平台{% endblock %}
{% block page_title %}注册新用户{% endblock %}
{% block page_desc %}添加新用户到平台{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;">
    <div class="card-header">
        <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
            注册新用户
        </h3>
    </div>
    <div class="card-body">
        <form method="post">
            <div class="form-group">
                <label>用户ID <span class="required">*</span></label>
                <input type="text" name="user_id" required placeholder="例如: u005">
                <p class="helper-text">唯一标识符，格式建议 uXXX</p>
            </div>
            <div class="form-group">
                <label>用户名 <span class="required">*</span></label>
                <input type="text" name="user_name" required placeholder="例如: WangXiaoMing">
            </div>
            <div class="form-group">
                <label>手机号 <span class="required">*</span></label>
                <input type="text" name="phone" required placeholder="例如: 13800000005">
                <p class="helper-text">11位手机号码</p>
            </div>
            <div style="display:flex;gap:0.75rem;">
                <button type="submit" class="btn btn-success">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    注册
                </button>
                <a href="/users" class="btn btn-ghost">返回</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
