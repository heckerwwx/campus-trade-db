{% extends "base.html" %}
{% block title %}添加商品 - 校园二手交易平台{% endblock %}
{% block page_title %}添加商品{% endblock %}
{% block page_desc %}发布新的二手商品{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;">
    <div class="card-header">
        <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            添加新商品
        </h3>
    </div>
    <div class="card-body">
        <form method="post">
            <div class="form-group">
                <label>商品ID <span class="required">*</span></label>
                <input type="text" name="item_id" required placeholder="例如: i006">
            </div>
            <div class="form-group">
                <label>商品名称 <span class="required">*</span></label>
                <input type="text" name="item_name" required placeholder="例如: USB Cable">
            </div>
            <div class="form-group">
                <label>类别 <span class="required">*</span></label>
                <select name="category" required>
                    <option value="Book">Book</option>
                    <option value="DailyGoods">DailyGoods</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                </select>
            </div>
            <div class="form-group">
                <label>价格 (元) <span class="required">*</span></label>
                <input type="number" name="price" step="0.01" min="0.01" required placeholder="例如: 25.00">
            </div>
            <div class="form-group">
                <label>卖家 <span class="required">*</span></label>
                <select name="seller_id" required>
                    {% for u in users %}
                    <option value="{{ u.user_id }}">{{ u.user_id }} - {{ u.user_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div style="display:flex;gap:0.75rem;">
                <button type="submit" class="btn btn-success">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    提交
                </button>
                <a href="/items" class="btn btn-ghost">返回</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
