{% extends "base.html" %}
{% block title %}修改价格 - 校园二手交易平台{% endblock %}
{% block page_title %}修改价格{% endblock %}
{% block page_desc %}调整商品价格{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
    <div class="card-header">
        <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            修改商品价格
        </h3>
    </div>
    <div class="card-body">
        <div style="background:linear-gradient(135deg,var(--primary-50),var(--primary-100));padding:1.25rem;border-radius:var(--radius);margin-bottom:1.5rem;border:1px solid var(--primary-200);">
            <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;">
                <div style="width:40px;height:40px;border-radius:var(--radius);background:linear-gradient(135deg,var(--primary-600),var(--primary-700));color:#fff;display:flex;align-items:center;justify-content:center;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                </div>
                <div>
                    <p style="font-size:0.8rem;color:var(--gray-500);">商品</p>
                    <p style="font-weight:600;color:var(--gray-900);">{{ item.item_name }} <span style="color:var(--gray-400);font-weight:400;">({{ item.item_id }})</span></p>
                </div>
            </div>
            <p style="font-size:0.875rem;color:var(--gray-600);">当前价格: <strong style="color:var(--warning-600);font-size:1.1rem;">¥{{ item.price }}</strong></p>
        </div>
        <form method="post">
            <div class="form-group">
                <label>新价格 (元) <span class="required">*</span></label>
                <input type="number" name="price" step="0.01" min="0.01" required value="{{ item.price }}">
            </div>
            <div style="display:flex;gap:0.75rem;">
                <button type="submit" class="btn btn-warning">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    确认修改
                </button>
                <a href="/items" class="btn btn-ghost">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
